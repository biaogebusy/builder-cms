view own credits:
  title: 'View own credit account and transactions'
  description: 'Read personal credit information. Does not authorize grants or spending.'
view user credits:
  title: 'View managed users credit accounts and transactions'
  description: 'Read public ledger fields for viewable users. Does not expose internal audit notes or authorize gifts.'
