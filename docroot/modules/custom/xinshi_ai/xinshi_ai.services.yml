services:
  xinshi_ai.figma_vault:
    class: Drupal\xinshi_ai\Service\FigmaVault
    arguments: ['@keyvalue', '@private_key']

  xinshi_ai.figma:
    class: Drupal\xinshi_ai\Service\FigmaConnector
    arguments: ['@config.factory', '@current_user', '@xinshi_ai.figma_vault', '@http_client', '@lock', '@datetime.time']

  xinshi_ai.product_documents:
    class: Drupal\xinshi_ai\Service\ProductDocuments
    arguments: ['@config.factory', '@entity_type.manager', '@entity_field.manager', '@current_user', '@language_manager', '@?xinshi_knowledge.documents']

  logger.channel.xinshi_ai:
    parent: logger.channel_base
    arguments: ['xinshi_ai']

  plugin.manager.xinshi_ai_task:
    class: Drupal\xinshi_ai\AiTaskManager
    parent: default_plugin_manager

  xinshi_ai.model_registry:
    class: Drupal\xinshi_ai\Service\ModelRegistryService
    arguments: ['@config.factory', '@cache.default']
    tags:
      - { name: backend_overridable }

  xinshi_ai.provider_resolver:
    class: Drupal\xinshi_ai\Service\ProviderResolver
    arguments: ['@ai.provider', '@config.factory', '@http_handler_stack', '@xinshi_ai.image_job_credentials']

  # Encrypted, expiring store for the connection secrets of custom-platform jobs (UB2.7).
  xinshi_ai.image_job_credentials:
    class: Drupal\xinshi_ai\Service\ImageJobCredentialVault
    arguments: ['@keyvalue.expirable', '@private_key']

  # Usage attempts and delivery facts of image jobs (UB2.4).
  xinshi_ai.image_usage_recorder:
    class: Drupal\xinshi_ai\Service\ImageUsageRecorder
    arguments: ['@xinshi_ai_usage.local_producer', '@logger.channel.xinshi_ai']

  # Orders the prompt pre-rewrite of image jobs from the chat service (UB2.6).
  xinshi_ai.prompt_rewrite:
    class: Drupal\xinshi_ai\Service\PromptRewriteClient
    arguments: ['@config.factory', '@http_client', '@xinshi_ai_usage.producer_identity', '@datetime.time', '@logger.channel.xinshi_ai']

  xinshi_ai.provider_error_mapper:
    class: Drupal\xinshi_ai\Service\ProviderErrorMapper

  xinshi_ai.job_lifecycle:
    class: Drupal\xinshi_ai\Service\JobLifecycleService
    arguments: ['@entity_type.manager', '@datetime.time', '@entity.repository', '@lock']

  # Execution leases and queue decisions of image jobs (UB2.5).
  xinshi_ai.image_job_runs:
    class: Drupal\xinshi_ai\Service\ImageJobRuns
    arguments: ['@database', '@datetime.time', '@uuid']

  xinshi_ai.image_job_executor:
    class: Drupal\xinshi_ai\Service\ImageJobExecutor
    arguments: ['@plugin.manager.xinshi_ai_task', '@xinshi_ai.job_lifecycle', '@xinshi_ai.provider_error_mapper', '@queue', '@xinshi_ai.event_stream', '@xinshi_ai.image_job_runs', '@xinshi_ai.image_usage_recorder', '@logger.channel.xinshi_ai', '@xinshi_ai.image_job_credentials']

  xinshi_ai.media_upload:
    class: Drupal\xinshi_ai\Service\MediaUploadService
    arguments: ['@entity_type.manager', '@file.repository', '@file_system']

  xinshi_ai.event_stream:
    class: Drupal\xinshi_ai\Service\EventStreamService
    arguments: ['@cache.default']

  xinshi_ai.event_ticket:
    class: Drupal\xinshi_ai\Service\EventTicketService
    arguments: ['@private_key', '@config.factory']

  xinshi_ai.normalizer.image_job:
    class: Drupal\xinshi_ai\Normalizer\ImageJobNormalizer
    arguments: ['@entity_type.manager']
    tags:
      - { name: normalizer, priority: 20 }

  xinshi_ai.image_job_cache_subscriber:
    class: Drupal\xinshi_ai\EventSubscriber\ImageJobCacheSubscriber
    tags:
      - { name: event_subscriber }

  xinshi_ai.immediate_job_runner:
    class: Drupal\xinshi_ai\Service\ImmediateJobRunner
    arguments: ['@queue', '@plugin.manager.queue_worker', '@logger.channel.xinshi_ai']

  xinshi_ai.immediate_job_subscriber:
    class: Drupal\xinshi_ai\EventSubscriber\ImmediateJobSubscriber
    arguments: ['@xinshi_ai.immediate_job_runner']
    tags:
      - { name: event_subscriber }
