services:
  update_to_d11.panelizer_migrator:
    class: Drupal\update_to_d11\PanelizerMigrator
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@config.factory'
  update_to_d11.ckeditor4_migrator:
    class: Drupal\update_to_d11\Ckeditor4Migrator
    arguments:
      - '@entity_type.manager'
  update_to_d11.theme_negotiator:
    class: Drupal\update_to_d11\Theme\ManageThemeNegotiator
    arguments:
      - '@config.factory'
      - '@path.current'
      - '@path_alias.manager'
      - '@path.matcher'
    tags:
      - { name: theme_negotiator, priority: 1 }
