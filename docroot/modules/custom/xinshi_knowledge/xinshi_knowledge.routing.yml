xinshi_knowledge.settings:
  path: '/admin/config/content/xinshi-knowledge'
  defaults:
    _form: '\Drupal\xinshi_knowledge\Form\SettingsForm'
    _title: '知识库文档解析'
  requirements:
    _permission: 'administer xinshi knowledge'
xinshi_knowledge.document_status:
  path: '/node/{node}/knowledge-status'
  defaults:
    _form: '\Drupal\xinshi_knowledge\Form\DocumentStatusForm'
    _title: '附件解析状态'
  requirements:
    _custom_access: '\Drupal\xinshi_knowledge\Form\DocumentStatusForm::access'
  options:
    _admin_route: true
    parameters:
      node:
        type: entity:node
xinshi_knowledge.catalog:
  path: '/api/v3/knowledge'
  defaults:
    _controller: '\Drupal\xinshi_knowledge\Controller\KnowledgeCatalogController::listing'
  requirements:
    _permission: 'view xinshi knowledge'
    _user_is_logged_in: 'TRUE'
  methods: [GET]
  options:
    _auth: ['oauth2', 'cookie']
    no_cache: TRUE
xinshi_knowledge.catalog_summary:
  path: '/api/v3/knowledge/summary'
  defaults:
    _controller: '\Drupal\xinshi_knowledge\Controller\KnowledgeCatalogController::summary'
  requirements:
    _permission: 'view xinshi knowledge'
    _user_is_logged_in: 'TRUE'
  methods: [GET]
  options:
    _auth: ['oauth2', 'cookie']
    no_cache: TRUE
xinshi_knowledge.catalog_detail:
  path: '/api/v3/knowledge/{uuid}'
  defaults:
    _controller: '\Drupal\xinshi_knowledge\Controller\KnowledgeCatalogController::detail'
  requirements:
    _permission: 'view xinshi knowledge'
    _user_is_logged_in: 'TRUE'
    uuid: '[0-9a-fA-F-]{36}'
  methods: [GET]
  options:
    _auth: ['oauth2', 'cookie']
    no_cache: TRUE
