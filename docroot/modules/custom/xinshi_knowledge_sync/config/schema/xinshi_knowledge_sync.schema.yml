xinshi_knowledge_sync.settings:
  type: config_object
  label: Knowledge directory synchronization
  mapping:
    sources:
      type: sequence
      label: Administrator configured sources
      sequence:
        type: mapping
        mapping:
          id:
            type: string
          enabled:
            type: boolean
          default_policy:
            type: string
          policies:
            type: sequence
            sequence:
              type: mapping
              mapping:
                id:
                  type: string
                all_readers:
                  type: boolean
                roles:
                  type: sequence
                  sequence:
                    type: string
                users:
                  type: sequence
                  sequence:
                    type: integer
          rules:
            type: sequence
            sequence:
              type: mapping
              mapping:
                prefix:
                  type: string
                policy:
                  type: string
