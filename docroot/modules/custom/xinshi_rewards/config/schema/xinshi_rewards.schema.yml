xinshi_rewards.settings:
  type: config_object
  label: 'Reward admission settings'
  mapping:
    welcome_enabled:
      type: boolean
      label: 'Enable first-visit rewards'
    daily_enabled:
      type: boolean
      label: 'Enable new daily rewards'
    admin_gifts_enabled:
      type: boolean
      label: 'Enable new administrator gifts'
    business_timezone:
      type: string
      label: 'Explicit business timezone, fixed by the first daily grant'
    points_pool_ids:
      type: sequence
      label: 'Active points-only reward pools'
      sequence:
        type: string
