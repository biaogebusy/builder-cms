    _csrf_request_header_token: 'TRUE'
    media_id: '[a-f0-9-]{36}'
  methods: [PATCH]
  options:
    _auth: ['oauth2', 'cookie']
    no_cache: TRUE

xinshi_media.remove:
  path: '/api/v3/media/{media_id}'
  defaults:
    _controller: '\Drupal\xinshi_media\Controller\MediaController::remove'
    _format: 'json'
  requirements:
    _user_is_logged_in: 'TRUE'
    _permission: 'view media'
    _csrf_request_header_token: 'TRUE'
    media_id: '[a-f0-9-]{36}'
  methods: [DELETE]
