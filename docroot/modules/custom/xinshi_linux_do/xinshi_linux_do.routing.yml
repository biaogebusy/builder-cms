xinshi_linux_do.settings:
  path: '/admin/xinshi/config/linux_do'
  defaults:
    _form: '\Drupal\xinshi_linux_do\Form\LinuxDoSettingsForm'
    _title: 'Linux.do OAuth Settings'
  requirements:
    _permission: 'administer xinshi linux_do'

xinshi_linux_do.user.login:
  path: '/user/login/linux_do'
  defaults:
    _controller: '\Drupal\xinshi_linux_do\Controller\LinuxDoAuthController::login'
    _title: 'Login with linux.do'
  requirements:
    _custom_access: '\Drupal\xinshi_linux_do\Controller\LinuxDoAuthController::loginAccess'
  options:
    no_cache: TRUE

xinshi_linux_do.user.callback:
  path: '/user/login/linux_do/callback'
  defaults:
    _controller: '\Drupal\xinshi_linux_do\Controller\LinuxDoAuthController::callback'
    _title: 'linux.do callback'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Restricting _auth to 'oauth2' is what replaces the CSRF token core's
# user.logout relies on: a cross-site request can carry the session cookie but
# never the Authorization header, so it cannot force a logout. Dropping
# _user_is_logged_in would reopen exactly that hole, because a cookie-only
# request would then reach the controller.
xinshi_linux_do.session.logout:
  path: '/api/v3/session/logout'
  defaults:
    _controller: '\Drupal\xinshi_linux_do\Controller\SessionLogoutController::logout'
    _title: 'Destroy Drupal session'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: [ 'oauth2' ]
    no_cache: TRUE
