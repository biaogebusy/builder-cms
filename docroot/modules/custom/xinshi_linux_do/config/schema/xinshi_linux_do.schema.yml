xinshi_linux_do.settings:
  type: config_object
  label: 'Linux.do OAuth settings'
  mapping:
    client_id:
      type: string
      label: 'Client ID'
    client_secret:
      type: string
      label: 'Client secret'
    authorize_url:
      type: string
      label: 'Authorize endpoint'
    token_url:
      type: string
      label: 'Token endpoint'
    userinfo_url:
      type: string
      label: 'User info endpoint'
    login_activate:
      type: boolean
      label: 'Enable linux.do login'
    download_avatar:
      type: boolean
      label: 'Download avatar to local'
