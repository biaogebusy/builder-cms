services:
  xinshi_shooting_plan.sharing:
    class: Drupal\xinshi_shooting_plan\Service\ShootingSharing
    arguments: ['@database', '@entity_type.manager', '@current_user', '@account_switcher', '@xinshi_shooting_plan.documents', '@xinshi_shooting_plan.sketches']

  xinshi_shooting_plan.documents:
    class: Drupal\xinshi_shooting_plan\Service\ShootingDocumentAccess
    arguments: ['@database', '@entity_type.manager', '@current_user', '@jsonapi.resource_type.repository', '@xinshi_ai.input_images']

  xinshi_shooting_plan.sketches:
    class: Drupal\xinshi_shooting_plan\Service\ShootingSketches
    arguments: ['@database', '@entity_type.manager', '@current_user', '@xinshi_shooting_plan.documents', '@xinshi_ai.job_lifecycle', '@plugin.manager.xinshi_ai_task', '@xinshi_ai.model_registry', '@queue', '@uuid', '@file_url_generator', '@xinshi_ai.immediate_job_runner', '@config.factory', '@account_switcher', '@xinshi_ai.image_job_credentials', '@xinshi_ai.public_url_policy', '@xinshi_ai.input_images']
