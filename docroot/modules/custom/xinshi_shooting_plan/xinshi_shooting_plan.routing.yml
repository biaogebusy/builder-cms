xinshi_shooting_plan.sketches.read:
  path: '/api/v3/ai/shooting-plans/{chat_uuid}/sessions/{session_uuid}/sketches'
  defaults:
    _controller: '\Drupal\xinshi_shooting_plan\Controller\ShootingSketchController::read'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'
    chat_uuid: '[0-9a-f-]+'
    session_uuid: '[0-9a-f-]+'

xinshi_shooting_plan.sketches.submit:
  path: '/api/v3/ai/shooting-plans/{chat_uuid}/sessions/{session_uuid}/sketches'
  defaults:
    _controller: '\Drupal\xinshi_shooting_plan\Controller\ShootingSketchController::submit'
    _format: 'json'
  methods: [POST]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _csrf_request_header_token: 'TRUE'
    _permission: 'create xinshi_ai image job'
    chat_uuid: '[0-9a-f-]+'
    session_uuid: '[0-9a-f-]+'
