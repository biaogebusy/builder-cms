# Service-to-service ingest for usage events, under the custom /api/v3 prefix. Access is decided
# by the producer signature inside the controller, never by a user session; see docs
# "Drupal 事件 ingest 与服务身份".
xinshi_ai_usage.ingest:
  path: '/api/v3/ai/metering/events'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageIngestController::ingest'
    _format: 'json'
  methods: [POST]
  options:
    no_cache: TRUE
  requirements:
    _access: 'TRUE'

# Producer registry: generates and rotates the secrets the ingest verifies.
xinshi_ai_usage.settings:
  path: '/admin/config/xinshi/ai/usage'
  defaults:
    _form: '\Drupal\xinshi_ai_usage\Form\ProducerSettingsForm'
    _title: 'AI 用量计量'
  requirements:
    _permission: 'administer xinshi ai usage'
  options:
    _admin_route: TRUE

# Purchasing price book management.
xinshi_ai_usage.price_book:
  path: '/admin/config/xinshi/ai/usage/pricing'
  defaults:
    _form: '\Drupal\xinshi_ai_usage\Form\PriceBookForm'
    _title: '采购价卡'
  requirements:
    _permission: 'administer xinshi ai pricing'
  options:
    _admin_route: TRUE

# Read-only usage reports of the authenticated user (UB3.1). The account comes
# from the session / OAuth token; scope parameters in the query are refused.
xinshi_ai_usage.report.summary:
  path: '/api/v3/ai/usage/me/summary'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageReportController::summary'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'

xinshi_ai_usage.report.timeseries:
  path: '/api/v3/ai/usage/me/timeseries'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageReportController::timeseries'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'

xinshi_ai_usage.report.operations:
  path: '/api/v3/ai/usage/me/operations'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageReportController::operations'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'

xinshi_ai_usage.report.operation:
  path: '/api/v3/ai/usage/me/operations/{operation}'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageReportController::operation'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'
    operation: '[A-Za-z0-9_.:-]{1,128}'

# Site-wide admin usage reports (UB3.3). The site is fixed by registration;
# a `site` query parameter is refused. Quantity endpoints need
# `view site ai usage`; costs additionally need `view ai supplier costs`.
# In `_permission` a comma joins with AND and `+` with OR (PermissionAccessCheck).
xinshi_ai_usage.admin.summary:
  path: '/api/v3/ai/admin/reports/summary'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::summary'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'

xinshi_ai_usage.admin.timeseries:
  path: '/api/v3/ai/admin/reports/timeseries'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::timeseries'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'

xinshi_ai_usage.admin.breakdown:
  path: '/api/v3/ai/admin/reports/breakdown/{dimension}'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::breakdown'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'
    dimension: 'users|features|models|channels|roles'

xinshi_ai_usage.admin.costs:
  path: '/api/v3/ai/admin/reports/costs/{dimension}'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::costs'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage,view ai supplier costs'
    dimension: 'users|features|models|channels|roles'

# Consistency check of one window: every split must add up to the summary (UB3.4).
xinshi_ai_usage.admin.consistency:
  path: '/api/v3/ai/admin/reports/consistency'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::consistency'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'

# Site-wide operation list and detail (admin drilldown): the admin counterpart
# of the user's operations endpoints. Rows carry the actor; quantity only.
xinshi_ai_usage.admin.operations:
  path: '/api/v3/ai/admin/reports/operations'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::operations'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'

xinshi_ai_usage.admin.operation:
  path: '/api/v3/ai/admin/reports/operations/{operation}'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::operation'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'
    operation: '[A-Za-z0-9_.:-]{1,128}'

# Data-quality report and deduplicated work queue of one window (UB3.5a).
# Read-only: resolving an item happens through the Drush reconcile command,
# the Node reconcile route or the price book form, never here. The unpriced
# family and unpriced queue rows need `view ai supplier costs` on top and are
# hidden without it.
xinshi_ai_usage.admin.quality:
  path: '/api/v3/ai/admin/reports/quality'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::quality'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'

xinshi_ai_usage.admin.quality_items:
  path: '/api/v3/ai/admin/reports/quality/items'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\SiteUsageReportController::qualityItems'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage'

# CSV exports (UB3.4). A job is created and run in the request; the file is
# downloadable by its requester for one hour. Cookie sessions must pass the
# CSRF token on the POST, as for every state-changing route.
xinshi_ai_usage.report.exports:
  path: '/api/v3/ai/usage/me/exports'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageExportController::createUser'
    _format: 'json'
  methods: [POST]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'

xinshi_ai_usage.report.export:
  path: '/api/v3/ai/usage/me/exports/{export}'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageExportController::statusUser'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'
    export: '\d+'

xinshi_ai_usage.report.export_download:
  path: '/api/v3/ai/usage/me/exports/{export}/download'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageExportController::downloadUser'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _user_is_logged_in: 'TRUE'
    export: '\d+'

xinshi_ai_usage.admin.exports:
  path: '/api/v3/ai/admin/reports/exports'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageExportController::createSite'
    _format: 'json'
  methods: [POST]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage,export site ai usage'
    _csrf_request_header_token: 'TRUE'

xinshi_ai_usage.admin.export:
  path: '/api/v3/ai/admin/reports/exports/{export}'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageExportController::statusSite'
    _format: 'json'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage,export site ai usage'
    export: '\d+'

xinshi_ai_usage.admin.export_download:
  path: '/api/v3/ai/admin/reports/exports/{export}/download'
  defaults:
    _controller: '\Drupal\xinshi_ai_usage\Controller\UsageExportController::downloadSite'
  methods: [GET]
  options:
    no_cache: TRUE
    _auth: ['oauth2', 'cookie']
  requirements:
    _permission: 'view site ai usage,export site ai usage'
    export: '\d+'
