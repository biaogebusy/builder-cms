services:
  logger.channel.xinshi_ai_usage:
    parent: logger.channel_base
    arguments: ['xinshi_ai_usage']

  xinshi_ai_usage.producer_vault:
    class: Drupal\xinshi_ai_usage\Service\ProducerVault
    arguments: ['@keyvalue', '@private_key']

  xinshi_ai_usage.producer_identity:
    class: Drupal\xinshi_ai_usage\Service\ProducerIdentity
    arguments: ['@settings', '@keyvalue.expirable', '@datetime.time', '@xinshi_ai_usage.producer_vault']

  xinshi_ai_usage.ingest:
    class: Drupal\xinshi_ai_usage\Service\UsageIngestService
    arguments: ['@database', '@datetime.time', '@logger.channel.xinshi_ai_usage']

  xinshi_ai_usage.price_book:
    class: Drupal\xinshi_ai_usage\Service\PriceBookService
    arguments: ['@database', '@datetime.time']

  xinshi_ai_usage.cost_rating:
    class: Drupal\xinshi_ai_usage\Service\CostRatingService
    arguments: ['@database', '@xinshi_ai_usage.price_book', '@datetime.time']

  xinshi_ai_usage.projection:
    class: Drupal\xinshi_ai_usage\Service\UsageProjectionService
    arguments: ['@database', '@xinshi_ai_usage.cost_rating', '@lock', '@datetime.time', '@logger.channel.xinshi_ai_usage']
