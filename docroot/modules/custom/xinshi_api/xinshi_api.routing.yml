xinshi_api.settings:
  path: '/admin/xinshi/config/api'
  defaults:
    _form: '\Drupal\xinshi_api\Form\SettingsForm'
    _title: 'XINSHI API'
  requirements:
    _permission: 'administer xinshi api configuration'

xinshi_api.v3.landingPage.builder:
  path: '/api/v3/landingPage/builder'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageBuilder'
    _title: 'landingPage builder'
  requirements:
    _permission: 'create landing_page content'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]

xinshi_api.v3.landingPage.canonical:
  path: '/api/v3/landingPage/json/{node}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageCanonical'
    _title: 'landingPage canonical'
  requirements:
    _entity_access: 'node.view'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
  methods: [ GET ]

xinshi_api.v3.landingPage.revisions:
  path: '/api/v3/landingPage/revisions/{node}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageRevisions'
    _title: 'landingPage revisions'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
  methods: [ GET ]

xinshi_api.v3.landingPage.revision.canonical:
  path: '/api/v3/landingPage/revisions/{node}/{vid}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageRevisionCanonical'
    _title: 'landingPage revision canonical'
  requirements:
    _entity_access: 'node.update'
    node: \d+
    vid: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
  methods: [ GET ]

xinshi_api.v3.landingPage.update:
  path: '/api/v3/landingPage/update/{node}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageUpdate'
    _title: 'landingPage update'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
  methods: [ PATCH ]

xinshi_api.v3.landingPage.alias:
  path: '/api/v3/landingPage/alias/{node}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageAlias'
    _title: 'landingPage alias'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
  methods: [ POST ]

xinshi_api.v3.landingPage.translations.add:
  path: '/api/v3/landingPage/translations/add/{node}/{source}/{target}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageTranslations'
    _title: 'landingPage update'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
      source:
        type: 'language'
      target:
        type: 'language'
  methods: [ POST ]

xinshi_api.v3.landingPage.translations.delete:
  path: '/api/v3/landingPage/translations/delete/{node}/{langcode}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::landingPageTranslationsDelete'
    _title: 'landingPage delete translation'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
      langcode:
        type: 'language'
  methods: [ POST ]

xinshi_api.v3.node.translations.add:
  path: '/api/v3/node/translations/add/{node}/{source}/{target}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PanelsIPEPageController::nodeTranslations'
    _title: 'node translation add'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    _auth: [ 'oauth2', 'cookie' ]
    parameters:
      node:
        type: 'entity:node'
      source:
        type: 'language'
      target:
        type: 'language'
  methods: [ POST ]

xinshi_api.v3.landingPage.drafts.capabilities:
  path: '/api/v3/landingPage/drafts/capabilities'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PageDraftController::capabilities'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [ GET ]
  options:
    _auth: [ 'oauth2', 'cookie' ]
    no_cache: TRUE

xinshi_api.v3.landingPage.drafts.create:
  path: '/api/v3/landingPage/drafts/{execution_id}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PageDraftController::createDraft'
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'
    execution_id: '[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]
    no_cache: TRUE

xinshi_api.v3.landingPage.drafts.find:
  path: '/api/v3/landingPage/drafts/{execution_id}'
  defaults:
    _controller: '\Drupal\xinshi_api\Controller\PageDraftController::findDraft'
  requirements:
    _user_is_logged_in: 'TRUE'
    execution_id: '[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}'
  methods: [ GET ]
  options:
    _auth: [ 'oauth2', 'cookie' ]
    no_cache: TRUE
