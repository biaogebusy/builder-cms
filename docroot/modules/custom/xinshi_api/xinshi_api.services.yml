services:
  xinshi_api.page_drafts:
    class: Drupal\xinshi_api\PageDraftService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@current_user'
      - '@language_manager'
      - '@datetime.time'
      - '@?panelizer'
      - '@?panels.display_manager'
      - '@?content_moderation.moderation_information'
      - '@?content_moderation.state_transition_validation'
  xinshi_api.twig.extension:
    class: Drupal\xinshi_api\TwigExtension\DefaultTwigExtension
    tags:
      - { name: twig.extension }
  xinshi_api.route_subscriber:
    class: Drupal\xinshi_api\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  xinshi_api.auth:
    class: Drupal\xinshi_api\UserAuth
    arguments: ['@entity_type.manager', '@password']
