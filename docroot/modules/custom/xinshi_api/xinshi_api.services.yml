services:
  xinshi_api.page_moderation_policy:
    class: Drupal\xinshi_api\PageModerationPolicy
    arguments: ['@?content_moderation.moderation_information', '@?content_moderation.state_transition_validation', '@current_user']
  xinshi_api.page_writer:
    class: Drupal\xinshi_api\PageWriteService
    arguments: ['@database', '@entity_type.manager', '@current_user', '@language_manager', '@uuid', '@xinshi_api.page_moderation_policy', '@?content_translation.manager', '@inline_block.usage']
  xinshi_api.page_drafts:
    class: Drupal\xinshi_api\PageDraftService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@current_user'
      - '@language_manager'
      - '@datetime.time'
      - '@uuid'
      - '@xinshi_api.page_moderation_policy'
  xinshi_api.twig.extension:
    class: Drupal\xinshi_api\TwigExtension\DefaultTwigExtension
    tags:
      - { name: twig.extension }
  xinshi_api.route_subscriber:
    class: Drupal\xinshi_api\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  xinshi_api.auth:
    class: Drupal\xinshi_api\UserAuth
    arguments: ['@entity_type.manager', '@password']
