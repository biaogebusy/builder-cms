services:
  _defaults:
    autowire: true
  plugin.manager.advancedqueue_backend:
    class: Drupal\advancedqueue\BackendManager
    parent: default_plugin_manager

  plugin.manager.advancedqueue_job_type:
    class: Drupal\advancedqueue\JobTypeManager
    parent: default_plugin_manager

  advancedqueue.processor:
    class: Drupal\advancedqueue\Processor
    arguments: ['@event_dispatcher', '@datetime.time', '@plugin.manager.advancedqueue_job_type', '@logger.factory']
  Drupal\advancedqueue\ProcessorInterface: '@advancedqueue.processor'

  Drupal\advancedqueue\Hook\AdvancedqueueHooks: ~
  Drupal\advancedqueue\Hook\AdvancedqueueViewsHooks: ~
